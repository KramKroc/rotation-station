<style>
/* Layout: one narrow sideline column — sticky tab bar, scoreboard clock, player cards, fixed thumb bar at the bottom. Deliberately single dark "sports hall" theme per spec. */
:root{
  --bg:#020617; --panel:#0b1328; --panel2:#111c36; --line:#1f2b46;
  --fg:#e6ebf5; --muted:#8a97b3; --accent:#f97316; --accent-ink:#1a0a00;
  --go:#22c55e; --warn:#fbbf24; --bad:#ef4444; --hot:#fb5a73; --cold:#38bdf8;
  --t1:#f97316; --t2:#a78bfa; --t3:#34d399; --t4:#94a3b8;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.35;touch-action:pan-y;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,select,input{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-left,0px))}
.hrow{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.brand span{color:var(--accent)}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs button{min-height:44px;min-width:52px;padding:0 10px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-family:var(--display);font-size:16px;letter-spacing:.05em;text-transform:uppercase}
.hrow{min-width:0}.tabs{flex-shrink:0}
@media (max-width:520px){.brand span{display:none}.brand{font-size:19px}.tabs{gap:3px}.tabs button{min-width:0;padding:0 9px;font-size:15px;letter-spacing:.03em}}
@media (max-width:340px){.brand{display:none}.tabs{margin-left:0;flex:1}.tabs button{flex:1}}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
h2{font-family:var(--display);font-size:22px;letter-spacing:.04em;text-transform:uppercase;margin:20px 0 8px;text-wrap:balance}
h3{font-family:var(--display);font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}
/* status strip */
.status{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.per{font-family:var(--display);font-size:24px;letter-spacing:.04em}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px solid currentColor;white-space:nowrap}
.chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)} .chip.go{color:var(--go)} .chip.hot{color:var(--hot)} .chip.cold{color:var(--cold)} .chip.acc{color:var(--accent)}
.sp{flex:1}
.btn{min-height:48px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:700}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}
/* clock */
.clock{display:block;width:100%;margin-top:10px;border-radius:16px;border:2px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));padding:10px 12px 12px;text-align:center;user-select:none;-webkit-user-select:none}
.clock .digits{font-family:var(--display);font-weight:700;font-size:clamp(76px,24vw,128px);line-height:1;letter-spacing:.02em}
.clock .state{font-weight:700;letter-spacing:.12em;font-size:13px;text-transform:uppercase;margin-top:2px}
.clock.run{border-color:var(--go)} .clock.run .state{color:var(--go)}
.clock.stop .state{color:var(--warn)}
.cloaux{display:flex;gap:8px;margin-top:8px}
.cloaux .btn{flex:1}
.banner{margin-top:10px;padding:10px 12px;border-radius:10px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.pause{background:color-mix(in srgb,var(--warn) 16%,var(--bg));border:1px solid var(--warn);color:var(--warn)}
.banner.lock{background:color-mix(in srgb,var(--accent) 14%,var(--bg));border:1px solid var(--accent);color:var(--accent)}
.banner.fdb{flex-direction:column;align-items:stretch}.banner.fdb .pbtns .btn{flex:1}
.banner.bad{background:color-mix(in srgb,var(--bad) 14%,var(--bg));border:1px solid var(--bad);color:var(--bad)}
.plannext{margin-top:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.plannext .txt{flex:1;min-width:0}
.plannext{display:grid;gap:8px}
.plannext.st-overdue{border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--bg))}
.plannext.st-overdue .ph b{color:var(--warn)}
.plannext.st-ready{border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg))}
.plannext.st-ready .ph b{color:var(--accent)}
.plannext.st-now{border:2px solid var(--go);background:color-mix(in srgb,var(--go) 12%,var(--bg))}
.plannext.st-now .ph b{color:var(--go)}
th.halfcol{background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
.ph b{font-family:var(--display);letter-spacing:.04em;font-size:18px;text-transform:uppercase}
.swaps{display:grid;gap:4px}
.swap{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-size:15px}
.swap span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arr{color:var(--muted)}
.pbtns{display:flex;gap:8px;flex-wrap:wrap}.pbtns .btn{flex:1}
.hint{font-family:var(--body);font-size:12px;letter-spacing:0;text-transform:none;font-weight:500;margin-left:6px}
.tiers{display:grid;gap:8px}
.scorebar{display:flex;gap:8px;margin-top:10px;align-items:stretch}
.sb{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-family:var(--display);letter-spacing:.04em}
.sb b{font-size:28px}.sb .tm{font-size:15px;text-transform:uppercase;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:30%}.sb .dash{color:var(--muted)}
.tobtn{display:flex;flex-direction:column;justify-content:center;line-height:1.1;padding:0 12px}
.scgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sccol{display:grid;gap:8px}.sccol h3{margin:0}
.btn.big{min-height:60px;font-family:var(--display);font-size:26px}
.inp{min-height:48px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 12px;width:100%;min-width:0}
pre.rc{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;overflow-x:auto}
.rcd summary{cursor:pointer;color:var(--muted);margin-top:8px;min-height:32px}
table.ssn td,table.ssn th{text-align:center}table.ssn td:first-child,table.ssn th:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
.bh{background:none;border:0;padding:4px 2px;min-height:44px;min-width:40px;font:inherit;color:inherit;cursor:pointer;border-radius:6px}
.bh:hover{background:var(--panel2)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:8px 0}
.tog.pick{text-align:left;padding:6px 10px;min-height:44px;color:var(--fg);font-weight:600}
.tog.pick.on,.tog.pick[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 28%,var(--bg));border-color:var(--accent);color:#fff}
.tog.pick.on::before{content:'✓ ';color:var(--accent);font-weight:800}
.tog.pick:disabled{opacity:.75}
.lc{display:grid;gap:6px}
.lcrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lcl{font-weight:600;flex:1;min-width:120px}.lcv{font-family:var(--display);font-size:24px}
.hline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px}.hline h2{margin:0;flex:1}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.trow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.tn{flex:1;min-width:0;font-weight:600}
.step{min-width:48px;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:22px;font-weight:700}
.tval{font-family:var(--display);font-size:26px;min-width:44px;text-align:center}
.tval::after{content:"m";font-size:15px;color:var(--muted);margin-left:1px}
.tbtn{margin-left:10px;min-height:36px;padding:0 12px;border-radius:8px;border:0;background:var(--bg);color:var(--fg);font-weight:700}
.plannext b{font-family:var(--display);letter-spacing:.04em;font-size:17px}
.inn{color:var(--go);font-weight:700}.outt{color:var(--bad);font-weight:700}
/* cards */
.list{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.card{min-width:0}
@media (max-width:360px){.trow{gap:6px;padding:8px}.step{min-width:44px}.tval{min-width:34px;font-size:22px}}
@media (max-width:380px){.act{min-width:56px;font-size:17px}.more{min-width:34px}.num{min-width:30px;font-size:20px}.r1{gap:5px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 8px 10px 12px;user-select:none;-webkit-user-select:none}
.card.on{border-color:#2c3a5c;background:var(--panel2)}
.card.pending{border-color:var(--warn);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 35%,transparent)}}
@media (prefers-reduced-motion:reduce){.card.pending{animation:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 35%,transparent)}}
.r1{display:flex;align-items:center;gap:6px}
.num{font-family:var(--display);font-size:22px;min-width:34px}
.nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tier{font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;color:var(--bg)}
.tier.t1{background:var(--t1)}.tier.t2{background:var(--t2)}.tier.t3{background:var(--t3)}.tier.t4{background:var(--t4)}
.fbtn,.act,.more{min-height:48px;min-width:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.fbtn.risk{border-color:var(--warn);color:var(--warn)}
.act{min-width:64px;font-family:var(--display);font-size:18px;letter-spacing:.06em}
.act.out{border-color:var(--bad);color:var(--bad)}
.act.in{border-color:var(--go);color:var(--go)}
.card.pending .act.out{background:var(--warn);color:var(--bg);border-color:var(--warn)}
.more{min-width:40px;color:var(--muted)}
.r2{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:13px;color:var(--muted)}
.bar{position:relative;height:8px;border-radius:4px;background:var(--bg);margin-top:6px;overflow:hidden;border:1px solid var(--line)}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.bar b{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--fg);opacity:.7}
.bar.ok i{background:var(--go)} .bar.short i{background:var(--warn)} .bar.way i{background:var(--bad)} .bar.over i{background:var(--cold)}
.bar.ok{background:color-mix(in srgb,var(--go) 14%,var(--bg))} .bar.short{background:color-mix(in srgb,var(--warn) 18%,var(--bg))} .bar.way{background:color-mix(in srgb,var(--bad) 20%,var(--bg))} .bar.over{background:color-mix(in srgb,var(--cold) 16%,var(--bg))}
.trk.ok{color:var(--go)} .trk.short{color:var(--warn)} .trk.way{color:var(--bad)} .trk.over{color:var(--cold)}
.fair{margin:6px 0 8px;line-height:1.6}
table.pmu th,table.pmu td{padding:6px 5px;font-size:13px}
#printv{position:fixed;inset:0;z-index:50;overflow:auto;background:#fff;color:#111;padding:16px;font:12px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
#printv[hidden]{display:none}

#printv .ps{color:#555;margin:0 0 10px}

/* tablets: use the width — wider page, on court and bench side by side */

.flash{position:fixed;inset:0;pointer-events:none;z-index:40;border-radius:0;transition:box-shadow .3s}
.flash.ready{box-shadow:inset 0 0 0 6px var(--warn),inset 0 0 40px 8px color-mix(in srgb,var(--warn) 45%,transparent)}

  const roster=prev?prev.roster.map(p=>({...p,hot:false,cold:false})):SEED.map(([num,name,tier])=>({id:'p'+num,num,name,tier,active:!SEED_OUT.includes(num),hot:false,cold:false,starter:SEED_STARTERS.includes(num),bh:SEED_BH.includes(num)}));

    closersIds:prev?prev.closersIds.slice():SEED_CLOSERS.map(n=>'p'+n),
    periods:Array(4).fill(qLen(prev)),period:1,clockSeconds:qLen(prev),clockRunning:false,lastTickTime:Date.now(),
    started:false,finished:false,pausedAt:null,onCourtIds:[],plan:{},fixed:{},applied:{},halves:{},pinned:{},moves:{},stats,adj:{},subLogs:[],undo:[],score:{us:0,them:0,ev:[]},tos:[],archived:false,foulAck:{},tf:{},tfThem:{},lineSecs:{},

let S;

const ui={tab:S.started?'live':'setup',pendingOut:null,sheet:null,sheetId:null,lpFired:false,lpUp:0,hotConfirm:null};
let lastSave=0;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=a=>a.reduce((x,y)=>x+y,0);
const P=id=>S.roster.find(p=>p.id===id);
const st=id=>(S.stats[id]||(S.stats[id]=blankStat()));

const tierOf=id=>(P(id)||{tier:4}).tier;
const len=()=>S.periods[S.period-1];
const qLabel=p=>p<=4?'Q'+p:'OT'+(p-4);
const mmss=s=>{s=Math.max(0,Math.ceil(s-1e-6));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const mmssShort=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const m1=x=>(Math.round(x*10)/10).toFixed(1);
const mt=x=>{const v=Math.round(x*10)/10;return Number.isInteger(v)?String(v):v.toFixed(1)};
const tag=id=>{const p=P(id);return p?'#'+p.num+' '+p.name:'?'};
const elapsedAbs=()=>sum(S.periods.slice(0,S.period-1))+(len()-S.clockSeconds);
const clockLabel=()=>qLabel(S.period)+' '+mmss(S.clockSeconds);
function log(text,kind){const d=new Date();S.subLogs.push({time:d.toTimeString().slice(0,8),text,kind:kind||''})}
function hideToast(){const el=$('#toast');if(el){el.hidden=true;clearTimeout(toast.h)}}
function toast(t,act,label){const el=$('#toast');el.innerHTML=esc(t)+(act?` <button class="tbtn" data-act="${act}">${label||'Undo'}</button>`:'');el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,act?4500:2200)}
const curBlock=()=>{const now=elapsedAbs();return blocksAll().find(b=>b.abs0<now&&now<b.abs1)};
const snap=()=>({applied:{...S.applied},fixed:JSON.parse(JSON.stringify(S.fixed)),plan:JSON.parse(JSON.stringify(S.plan||{})),halves:{...(S.halves||{})},early:{...(S.early||{})}});
const restoreSnap=u=>{if(u.applied)S.applied=u.applied;if(u.fixed)S.fixed=u.fixed;if(u.plan)S.plan=u.plan;if(u.halves)S.halves=u.halves;if(u.early)S.early=u.early};
const availList=()=>S.roster.filter(p=>p.active&&!st(p.id).fouledOut);
function foulRisk(id){const s=st(id);if(s.fouledOut)return false;const f=s.fouls;return f>=4||(S.period<=2&&f>=2)||(S.period<=3&&f>=3)}
function inLockLive(){const L=S.config.closerLockSeconds;if(!L)return false;if(S.period===4)return S.clockSeconds<=L&&S.clockSeconds>0;if(S.period>4)return S.config.lockOT;return false}

/* ---------- §2.2 targets ---------- */
const wt=p=>Math.max(0,+S.config.tierMins[p.tier]||0);
// the lowest tier playing today is protected: rounding, hot bonuses and rebalancing never take minutes from it
const protectedTier=()=>{const t=availList().map(p=>p.tier);return t.length?Math.max(...t):0};
function baseTargets(){
  const pool=5*sum(S.periods)/60,T={},av=availList(),ids=new Set(av.map(p=>p.id));
  let frozen=0;
  S.roster.forEach(p=>{if(!ids.has(p.id)){T[p.id]=played(p.id)/60;frozen+=T[p.id]}});
  const rem=Math.max(0,pool-frozen),ws=sum(av.map(p=>wt(p)));
  av.forEach(p=>T[p.id]=ws?Math.round(wt(p)/ws*rem*2)/2:0);
  let d=rem-sum(av.map(p=>T[p.id]));
  const pt=protectedTier(),hiFirst=[...av].sort((a,b)=>a.tier-b.tier),loFirst0=[...av].filter(p=>p.tier!==pt).sort((a,b)=>b.tier-a.tier),loFirst=loFirst0.length?loFirst0:[...av];
  let i=0,g=0;
  while(Math.abs(d)>=0.5&&av.length&&g++<1000){
    if(d>0){T[hiFirst[i%hiFirst.length].id]+=.5;d-=.5}
    else{const p=loFirst[i%loFirst.length];if(T[p.id]>=.5){T[p.id]-=.5;d+=.5}}
    i++;
  }
  return T;
}
// Season catch-up: a player more than a minute a game behind his season target gets back half of what he's owed
// this game (capped), taken half a minute at a time from players who aren't behind, top tier first; the lowest tier never gives.
let cuCache={k:null,v:null};
function seasonOwed(){   // num → minutes owed (season minutes short of season target), from games other than this one
  let raw='';try{raw=localStorage.getItem(SEASON_KEY)||''}catch(e){}
  const k=raw+'|'+S.match.id;if(cuCache.k===k)return cuCache.v;
  const out={};seasonLoad().games.filter(g=>g.id!==S.match.id&&!g.practice).forEach(g=>g.players.forEach(p=>{if(p.tgt>0){const o=out[p.num]||(out[p.num]={dt:0,gt:0});o.dt+=p.mins-p.tgt;o.gt++}}));
  cuCache={k,v:out};return out;
}
function catchUp(){
  const cap=+S.config.catchUp||0,res={give:{},take:{}};if(!cap)return res;
  const owed=seasonOwed(),av=availList(),pt=protectedTier();
  av.forEach(p=>{const o=owed[p.num];if(o&&o.gt&&o.dt/o.gt< -1){const b=Math.min(cap,Math.floor(-o.dt/2*2)/2);if(b>=0.5)res.give[p.id]=b}});
  let need=sum(Object.values(res.give));if(!need)return res;
  const donors=av.filter(p=>!res.give[p.id]&&p.tier!==pt&&!p.cold).sort((a,b)=>a.tier-b.tier||a.num-b.num),dcap=2;
  let moved=true;while(need>=0.5&&moved){moved=false;for(const d of donors){if(need<0.5)break;if((res.take[d.id]||0)+0.5<=dcap){res.take[d.id]=(res.take[d.id]||0)+0.5;need-=0.5;moved=true}}}
  if(need>=0.5){   // not enough donors: trim the bonuses, biggest first
    const ids=Object.keys(res.give).sort((a,b)=>res.give[b]-res.give[a]);let g=0;while(need>=0.5&&g++<200)for(const id of ids){if(need<0.5)break;if(res.give[id]>=0.5){res.give[id]-=0.5;need-=0.5}}
    Object.keys(res.give).forEach(id=>{if(!res.give[id])delete res.give[id]});
  }
  return res;
}
function targets(){
  const T=baseTargets(),ids=new Set(availList().map(p=>p.id));
  const ptier=protectedTier();
  Object.values(S.adj).forEach(ev=>Object.entries(ev).forEach(([id,m])=>{if(!ids.has(id))return;if(m<0&&P(id).tier===ptier&&!P(id).cold)return;   // the lowest tier never lends
    T[id]=Math.max(0,T[id]+m)}));
  const cu=catchUp();Object.entries(cu.give).forEach(([id,m])=>T[id]+=m);Object.entries(cu.take).forEach(([id,m])=>T[id]=Math.max(0,T[id]-m));
  // hot/cold moves can lose minutes (a player they were shared with got injured, or a target hit zero): rebalance to the pool
  const av=availList().filter(p=>!p.hot&&!p.cold),pool=5*sum(S.periods)/60;
  let d=pool-sum(S.roster.map(p=>T[p.id]||0)),i=0,g=0;
  const pt=protectedTier(),hi=[...av].sort((a,b)=>a.tier-b.tier),lo0=[...av].filter(p=>p.tier!==pt).sort((a,b)=>b.tier-a.tier),lo=lo0.length?lo0:[...av];
  while(d>=0.5&&av.length&&g++<1000){T[hi[i%hi.length].id]+=.5;d-=.5;i++}
  // too many minutes: take them from regular players, then from ❄️ players, never below what he's already played and never from the protected tier
  const coldOnes=availList().filter(p=>p.cold&&p.tier!==pt);
  for(const pool2 of [lo,coldOnes]){
    let moved=true;
    while(d<=-0.5&&moved){moved=false;for(const p of pool2){if(d>-0.5)break;if(T[p.id]-.5>=played(p.id)/60-1e-9){T[p.id]-=.5;d+=.5;moved=true}}}
  }
  // "keep N core on court" can need more core minutes than the tier minutes give them. Then the bench pays for it,
  // levelled down from the top: the bench player with the most minutes gives first, so a T3 never drops below a T4.
  const cs=coreShort(T);
  if(cs.short>=0.5){
    const core=cs.core,bench=av.filter(p=>p.tier>2);let need=cs.short,g2=0;
    while(need>=0.5&&g2++<2000){
      const can=bench.filter(p=>T[p.id]-.5>=Math.max(played(p.id)/60,0)-1e-9);if(!can.length)break;
      const top=Math.max(...can.map(p=>T[p.id]));const giver=can.filter(p=>T[p.id]===top).sort((x,y)=>(x.tier===pt)-(y.tier===pt)||y.tier-x.tier)[0];
      T[giver.id]-=.5;need-=.5;
      const taker=[...core].sort((x,y)=>T[x.id]-T[y.id])[0];T[taker.id]+=.5;
    }
  }
  return T;
}
// minutes the core (T1/T2) needs to keep the "core on court" floor, against what the tier minutes give them
function coreShort(T){
  const av=availList().filter(p=>!p.cold),core=av.filter(p=>p.tier<=2),fl=Math.min(+S.config.strongFloor||0,core.length,5);
  // the closers lock is its own case: every core closer is on for all of it, however many that is
  const L4=S.periods[3]||0,lk=Math.min(L4,+S.config.closerLockSeconds||0)/60;
  const cc=lk?Math.max(fl,(S.closersIds||[]).filter(id=>core.some(p=>p.id===id)).length):fl;
  const need=fl*(sum(S.periods)/60-lk)+cc*lk,have=sum(core.map(p=>T[p.id]||0));
  return {core,floor:fl,need,have,short:Math.max(0,need-have),lockCore:cc>fl};
}
function coreWarn(){

const wantAwake=()=>S.started&&!S.finished;
function awakeVideo(){
  if(awakeVid||typeof document.createElement!=='function')return awakeVid;
  const v=document.createElement('video');v.setAttribute('playsinline','');v.setAttribute('muted','');v.muted=true;v.setAttribute('title','Keep screen on');
  v.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:0;bottom:0';
  [['webm',NOSLEEP_WEBM],['mp4',NOSLEEP_MP4]].forEach(([t,src])=>{const s=document.createElement('source');s.src=src;s.type='video/'+t;v.appendChild(s)});
  v.addEventListener('loadedmetadata',()=>{if(v.duration<=1)v.setAttribute('loop','');else v.addEventListener('timeupdate',()=>{if(v.currentTime>0.5)v.currentTime=Math.random()})});
  try{document.body.appendChild(v)}catch(e){}

}
function setAwake(m){if(ui.awake!==m){ui.awake=m;if(ui.tab==='live'&&!ui.sheet)render()}}
async function requestWake(){
  if(!wantAwake()){releaseWake();return}

  try{if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;if(ui.awake==='lock')setAwake('none')});setAwake('lock');return}}catch(e){wakeLock=null}

function tick(){
  const t=Date.now();let el=(t-S.lastTickTime)/1000;S.lastTickTime=t;
  if(!(el>0))el=0;   // phone clock jumped backwards (manual change, network time fix): never run the game clock backwards
  if(!S.clockRunning)return false;

  S.onCourtIds.forEach(id=>{const s=st(id);s.playedSeconds+=c;while(s.periodSplit.length<S.period)s.periodSplit.push(0);s.periodSplit[S.period-1]+=c;s.consecutiveSeconds+=c});

  {const r=runAgainst();if(r&&toLeft('us')>0)return {kind:'run',key:'run:'+S.score.ev[S.score.ev.length-1].n}}
  const LC=liveCalls();if(LC.later)return null;
  const n=nextPlanned();if(!n||!n.ins.length)return null;

let alertLast={key:null,at:0};
function alertTick(){

/* ---------- subs, fouls, undo ---------- */
function doSub(outId,inId){
  const p=P(inId);if(!p||!p.active||st(inId).fouledOut||S.onCourtIds.includes(inId))return;
  if(!S.started){ // pre-game: edits the starting five
    if(outId){P(outId).starter=false}p.starter=true;
    S.onCourtIds=S.onCourtIds.filter(x=>x!==outId).concat(inId);ui.pendingOut=null;replan();save();render();return;
  }
  if(S.clockRunning)tick();
  const prevOn=S.onCourtIds.slice(),n=nextPlanned(),cur=curBlock();
  S.undo.push({type:'single',outId,inId,prevOn,prevConsec:st(inId).consecutiveSeconds,at:clockLabel(),...snap()});
  S.onCourtIds=outId?S.onCourtIds.map(x=>x===outId?inId:x):S.onCourtIds.concat(inId);
  const onPlan=n&&n.ins.includes(inId)&&(!outId||n.outs.includes(outId))&&(n.overdue||n.inSec<=earlySecs());
  if(onPlan&&!n.overdue){S.fixed[n.b.key]=n.pl.slice();if(cur)S.applied[cur.key]=true;if(n.pl.every(id=>S.onCourtIds.includes(id)))S.applied[n.b.key]=true}
  else if(onPlan&&n.overdue){if(n.pl.every(id=>S.onCourtIds.includes(id)))S.applied[n.b.key]=true}
  else if(cur)S.applied[cur.key]=true;
  st(inId).consecutiveSeconds=0;
  log(clockLabel()+' — '+tag(inId)+' IN'+(outId?' for '+tag(outId):''));
  ui.pendingOut=null;replan();save();render();
  toast(shortName(P(inId))+' in'+(outId?' for '+shortName(P(outId)):''),'undo');
}
const earlySecs=()=>Math.max(+S.config.readySecs||0,(+S.config.shiftLength||4)*30);   // a planned change made more than this early (half a block) is treated as a new decision, and the rest is re-planned
const nowBlock=()=>{const now=elapsedAbs();return blocksAll().find(b=>b.abs0<=now+0.5&&now<b.abs1-0.5)};
function markNowBlock(){const c=nowBlock();if(!c)return;S.applied[c.key]=true;if(c.abs0>=elapsedAbs()-0.5&&!S.pinned[c.key]){S.fixed[c.key]=S.onCourtIds.slice();(S.early=S.early||{})[c.key]=1}}   // what's on court now is this block's lineup
function quickSwap(confirmed){
  const n=nextPlanned();if(!n||!n.ins.length)return;
  if(n.fill){   // back to five: just add the replacement(s); the planned change for this block still stands
    if(S.clockRunning)tick();
    const prevOn=S.onCourtIds.slice(),prevConsec={};n.ins.forEach(id=>prevConsec[id]=st(id).consecutiveSeconds);
    S.undo.push({type:'mass',prevOn,prevConsec,ins:n.ins,outs:[],...snap()});
    S.onCourtIds=S.onCourtIds.concat(n.ins).slice(0,5);n.ins.forEach(id=>st(id).consecutiveSeconds=0);
    log(clockLabel()+' — IN '+n.ins.map(id=>'#'+P(id).num).join(' ')+' (back to five)');
    ui.pendingOut=null;replan();save();render();toast('IN '+n.ins.map(id=>shortName(P(id))).join(', ')+' · back to five','undo');return;
  }
  if(!n.overdue&&n.b.p>S.period&&S.clockSeconds>0){toast('That change is for the start of '+qLabel(n.b.p)+' — make it at the break');return}
  const early=!n.overdue&&n.inSec>earlySecs();
  if(early&&!confirmed&&ui.sheet!=='ourto'){ui.sheet='early';renderSheet();return}   // a long way ahead of time: check it wasn't a stray tap
  if(ui.sheet==='early')ui.sheet=null;
  if(S.clockRunning)tick();
  const prevOn=S.onCourtIds.slice(),prevConsec={};n.ins.forEach(id=>prevConsec[id]=st(id).consecutiveSeconds);
  S.undo.push({type:'mass',prevOn,prevConsec,ins:n.ins,outs:n.outs,...snap()});
  S.onCourtIds=S.onCourtIds.filter(id=>!n.outs.includes(id)).concat(n.ins).slice(0,5);
  n.ins.forEach(id=>st(id).consecutiveSeconds=0);
  if(early){markNowBlock();if(!S.pinned[n.b.key])delete S.fixed[n.b.key]}   // early: this five plays from now, and the planned change is picked again from the new minutes
  else{S.applied[n.b.key]=true;
  if(!n.overdue){S.fixed[n.b.key]=S.onCourtIds.slice();const c=curBlock();if(c)S.applied[c.key]=true}}
  const W=+S.config.onTimeSecs||0,when=n.overdue&&n.late>W?' (late by '+mmssShort(n.late)+')':!n.overdue&&n.inSec>W?' (early by '+mmssShort(n.inSec)+(early?', rest of game re-planned':'')+')':'';
  log(clockLabel()+' — QUICK SWAP'+when+': IN '+n.ins.map(id=>'#'+P(id).num).join(' ')+' • OUT '+n.outs.map(id=>'#'+P(id).num).join(' '));
  ui.pendingOut=null;replan();save();render();
  toast('IN '+n.ins.map(id=>shortName(P(id))).join(', ')+' · OUT '+n.outs.map(id=>shortName(P(id))).join(', '),'undo',n.ins.length>1?'Undo all '+n.ins.length:'Undo');
}
function pinBlock(key,ids){S.fixed[key]=ids.slice();S.pinned[key]=1;const b=blocksAll().find(x=>x.key===key);

function unpinBlock(key){delete S.fixed[key];delete S.pinned[key];log((S.started?clockLabel()+' — ':'')+'PLAN: unlocked '+key,'rp');replan();save();render()}
function moveBoundary(key,delta){
  const before=blocksAll().find(x=>x.key===key);if(!before||!before.movable||before.abs0<=elapsedAbs())return;

/* score, timeouts, runs */

function setScorer(id){const e=S.score.ev.find(x=>x.n===ui.askScorer&&x.side==='us');ui.askScorer=null;if(!e||!P(id))return;e.by=id;log(clockLabel()+' — '+tag(id)+' scored '+e.pts);save();render()}

  return `<div class="whos"><span class="muted small">Who scored +${e.pts}?</span><div class="whog">${ids.map(id=>`<button class="btn" data-act="scorer:${id}"><b>#${P(id).num}</b> ${esc(String(P(id).name).split(/\s+/).slice(-1)[0])}</button>`).join('')}<button class="btn ghost" data-act="scorer:-">Skip</button></div></div>`;

function pointsBy(){const o={};S.score.ev.forEach(e=>{if(e.side==='us'&&e.by)o[e.by]=(o[e.by]||0)+e.pts});return o}
function scoreMinus(side){
  if(S.clockRunning)tick();
  const ev=S.score.ev;let i=ev.length-1;while(i>=0&&ev[i].side!==side)i--;
  if(i<0||S.score[side]<=0){toast('No '+(side==='us'?tn():oppName())+' points to take off');return}
  const prev={...ev[i]};
  if(ev[i].pts>1)ev[i].pts--;else ev.splice(i,1);
  S.score[side]--;S.undo.push({type:'scorefix',side,i,prev});
  log(clockLabel()+' — SCORE FIX: '+(side==='us'?tn():oppName())+' −1 ('+S.score.us+'–'+S.score.them+')');save();render();
  toast((side==='us'?tn():oppName())+' −1 · '+S.score.us+'–'+S.score.them,'undo');
}
const toWindow=p=>p<=2?'h1':p<=4?'h2':'ot'+p;
const toAllowed=p=>p<=2?2:p<=4?3:1;
function toLeft(side){const w=toWindow(S.period);return toAllowed(S.period)-S.tos.filter(t=>t.side===side&&toWindow(t.p)===w).length}
function toLeftLast2(side){if(S.period!==4||S.clockSeconds>120)return null;return 2-S.tos.filter(t=>t.side===side&&t.p===4&&t.c<=120).length}
function callTimeout(side){
  if(toLeft(side)<=0){toast('No timeouts left this '+(S.period<=4?'half':'period'));return}
  if(toLeftLast2(side)===0){toast('Max 2 timeouts in the last 2:00 of Q4');return}
  if(S.clockRunning){tick();S.clockRunning=false;S.pausedAt=Date.now()}
  S.tos.push({side,p:S.period,c:Math.round(S.clockSeconds),t:Math.round(elapsedAbs()),n:S.seqN=(S.seqN||0)+1});S.undo.push({type:'timeout',side});
  log(clockLabel()+' — TIMEOUT '+(side==='us'?tn():oppName())+' ('+toLeft(side)+' left this '+(S.period<=4?'half':'period')+')');
  ui.sheet=side==='us'?'ourto':null;save();render();
}
// Session 7 rule: they score on 3 straight possessions (≈ 6–0 run) → timeout at the next dead ball
function runAgainst(){
  const ev=S.score.ev,lastTO=Math.max(0,...S.tos.filter(t=>t.side==='us').map(t=>t.n||0));
  let pts=0,n=0;
  for(let i=ev.length-1;i>=0&&ev[i].side==='them'&&(ev[i].n||0)>lastTO&&ev[i].p===S.period;i--){pts+=ev[i].pts;n++}   // our timeout, or the end of the quarter, ends a run
  return n>=3?{pts,n}:null;
}
/* plus/minus: points for minus points against while he was on court (only scores logged in this app version or later) */
const lineKey=ids=>ids.slice().sort().join(',');
function plusMinus(){
  const pm={},lines={};let counted=0;
  S.score.ev.forEach(e=>{if(!Array.isArray(e.on))return;counted++;const d=e.side==='us'?e.pts:-e.pts;
    e.on.forEach(id=>pm[id]=(pm[id]||0)+d);if(e.on.length===5){const k=lineKey(e.on),l=lines[k]||(lines[k]={for:0,against:0});if(d>0)l.for+=d;else l.against-=d}});
  const units=Object.entries(S.lineSecs||{}).filter(([k,sec])=>sec>=120).map(([k,sec])=>({ids:k.split(','),sec,for:(lines[k]||{}).for||0,against:(lines[k]||{}).against||0}))
    .map(u=>({...u,pm:u.for-u.against})).sort((a,b)=>b.sec-a.sec);
  return {pm,units,counted};
}
function scoreByQ(){const q=S.periods.map(()=>({us:0,them:0}));S.score.ev.forEach(e=>{if(q[e.p-1])q[e.p-1][e.side]+=e.pts});return q}

function importGame(text,date,opp,us,them){

  if(csvHead>=0){lines.slice(csvHead+1).forEach(l=>{const m=l.match(/^(\d+),"((?:[^"]|"")*)",(\d),([\d.]+),([\d.]+),[-\d.]+,(.*)$/);if(!m)return;
    const rest=m[6].split(',');players.push({num:+m[1],name:m[2].replace(/""/g,'"'),tier:+m[3],tgt:+m[4],mins:+m[5],fouls:+rest[rest.length-2]||0})})}
  else lines.forEach(l=>{const m=l.match(/#(\d+)\s+(.+?)\s+\(T(\d)\):\s*([\d.]+)m\s*\/\s*tgt\s*([\d.]+)m.*?F:(\d)/);if(m)players.push({num:+m[1],name:m[2],tier:+m[3],mins:+m[4],tgt:+m[5],fouls:+m[6]})});

/* rotation card for an assistant: the plan as plain text */
const shortName=p=>'#'+p.num+' '+String(p.name).split(/\s+/).slice(-1)[0];
function rotationCard(){
  const B=blocksAll(),now=elapsedAbs(),T=targets(),fut=B.filter(b=>b.abs1>now);
  const nm=ids=>ids.map(id=>shortName(P(id))).join(', ');
  let t='🏀 '+tfull().toUpperCase()+' — ROTATION PLAN'+(S.match.opp?' vs '+S.match.opp:'')+' · '+S.match.date+'\n';
  t+=S.config.shiftLength+'-min blocks'+(S.config.miniSubs?' + mini subs':'')+' · sub on the dead ball nearest each time · keep '+S.config.strongFloor+'+ core on court\n';

    const pl=S.plan[b.key]||[],at=blockLabel(b).split('–')[0],tagL=inLockBlock(b)?' 🔒 CLOSERS':b.half===2?' (mini sub)':S.pinned[b.key]?' 📌':'';
    if(!prev||b.s===0&&b.half!==2){
      const outs=prev?prev.filter(id=>!pl.includes(id)):[],ins=prev?pl.filter(id=>!prev.includes(id)):[];
      t+='\n'+qLabel(b.p)+' START'+tagL+': '+nm(pl)+'\n'+(ins.length?'        OFF '+nm(outs)+'  →  ON '+nm(ins)+'\n':'');}
    else{const outs=prev.filter(id=>!pl.includes(id)),ins=pl.filter(id=>!prev.includes(id));
      if(ins.length)t+=at.padEnd(8)+tagL.trim()+(tagL?' ':'')+'OFF '+nm(outs)+'  →  ON '+nm(ins)+'\n';}
    prev=pl;
  });
  t+='\n------------------------------------\nPlanned minutes:\n';
  const planned=id=>{let x=played(id);B.forEach(b=>{if(b.abs1<=now)return;if((S.plan[b.key]||[]).includes(id))x+=b.abs0>=now?b.dur:b.abs1-now});return x/60};
  availList().slice().sort((a,b)=>a.tier-b.tier||a.num-b.num).forEach(p=>{t+='• '+shortName(p)+' (T'+p.tier+') '+mt(planned(p.id))+' min\n'});
  t+='\nTimeouts: 2 first half, 3 second half (max 2 in last 2:00), 1 per OT.';
  return t;
}

function skipPlanned(){const n=nextPlanned();if(!n)return;S.applied[n.b.key]=true;log(clockLabel()+' — Skipped planned change for '+blockLabel(n.b).split('–')[0]);replan();save();render()}
// fix a player's minutes by hand: never below 0, never more than the game so far; this quarter first, then earlier ones
function adjMins(id,d){
  if(!S.started||!d)return;if(S.clockRunning)tick();
  const s=st(id);while(s.periodSplit.length<S.period)s.periodSplit.push(0);
  const before=s.playedSeconds,split=s.periodSplit.slice();
  let x=d>0?Math.min(d,Math.max(0,elapsedAbs()-s.playedSeconds)):-Math.min(-d,s.playedSeconds);
  if(!x){toast(d>0?tag(id)+' already has every minute played so far':tag(id)+' has no minutes to take off');return}
  if(x>0)s.periodSplit[S.period-1]+=x;else{let r=-x;for(let i=S.period-1;i>=0&&r>0;i--){const t=Math.min(r,s.periodSplit[i]||0);s.periodSplit[i]-=t;r-=t}}
  s.playedSeconds+=x;if(S.onCourtIds.includes(id))s.consecutiveSeconds=Math.max(0,s.consecutiveSeconds+x);
  S.undo.push({type:'mins',id,before,split,x});
  log(clockLabel()+' — MINUTES FIX: '+tag(id)+' '+(x>0?'+':'−')+mmssShort(Math.abs(x))+' (now '+mmss(s.playedSeconds)+')','rp');
  replan();save();render();toast(tag(id)+' '+(x>0?'+':'−')+mmssShort(Math.abs(x))+' · now '+mmss(s.playedSeconds),'undo');
}
function removePlayer(id){
  const p=P(id);if(!p)return;
  if(S.started&&played(id)>0){toast(tag(id)+' has played in this match — mark him Out instead');return}
  S.roster=S.roster.filter(x=>x.id!==id);S.closersIds=S.closersIds.filter(x=>x!==id);S.onCourtIds=S.onCourtIds.filter(x=>x!==id);
  for(const o of [S.plan,S.fixed])Object.keys(o).forEach(k=>{if(Array.isArray(o[k]))o[k]=o[k].filter(x=>x!==id)});
  Object.values(S.adj).forEach(ev=>{delete ev[id]});delete S.adj['hot:'+id];delete S.adj['cold:'+id];delete S.stats[id];
  S.undo=S.undo.filter(u=>!JSON.stringify(u).includes('"'+id+'"'));   // nothing left to undo that would bring him back
  log((S.started?clockLabel()+' — ':'')+'SQUAD: #'+p.num+' '+p.name+' removed','rp');
  replan();save();render();toast('#'+p.num+' '+p.name+' removed from the squad');
}
function undoFoul(id){const u=S.undo[S.undo.length-1];if(u&&u.type==='foul'&&u.id===id&&u.delta>0)undo();else addFoul(id,-1);toast('Foul removed — '+tag(id)+' now F:'+st(id).fouls)}
const tfKey=()=>Math.min(S.period,4);   // FIBA: overtime fouls count with Q4
const tfUs=()=>S.tf[tfKey()]||0,tfThem=()=>S.tfThem[tfKey()]||0;
function addTeamFoulThem(d){const k=tfKey();S.tfThem[k]=Math.max(0,(S.tfThem[k]||0)+d);log(clockLabel()+' — '+oppName()+' team fouls '+S.tfThem[k]);save();render()}
const foulBand=id=>{const s=st(id);return s.fouledOut?9:s.fouls>=4?4:foulRisk(id)?2:0};
function addFoul(id,delta){
  const s=st(id);if(delta<0&&s.fouls===0)return;
  const band0=foulBand(id);if(delta>0)clockNudge();
  const prevOn=S.onCourtIds.slice(),wasOut=s.fouledOut;
  s.fouls+=delta;
  const tk=tfKey(),tfD=delta>0?1:(S.tf[tk]||0)>0?-1:0;S.tf[tk]=(S.tf[tk]||0)+tfD;
  S.undo.push({type:'foul',id,delta,prevOn,wasOut,tk,tfD});
  if(s.fouls>=5&&!s.fouledOut){
    s.fouledOut=true;S.onCourtIds=S.onCourtIds.filter(x=>x!==id);
    log(clockLabel()+' — '+tag(id)+' FOULED OUT (5)','rp');
    log(clockLabel()+' — RE-PLAN: '+tag(id)+' fouled out, blocks re-solved','rp');
    replan();
  }else if(s.fouls<5&&s.fouledOut){s.fouledOut=false;replan()}
  else{log(clockLabel()+' — Foul '+(delta>0?'':'removed ')+tag(id)+' (F:'+s.fouls+')');
    if(S.config.foulAware&&S.config.foulAware!=='off'&&foulBand(id)!==band0)replan()}   // only a foul that crosses a foul-trouble line re-plans
  save();render();
  if(delta>0)toast('F:'+s.fouls+' — '+tag(id)+' · team fouls '+tfUs()+(tfUs()===4?' (next = free throws)':tfUs()>=5?' (free throws)':''),'foulundo:'+id);
}
function undoLabel(u){
  u=u||S.undo[S.undo.length-1];if(!u)return '';
  const nm=id=>shortName(P(id));
  if(u.type==='single')return nm(u.inId)+' in'+(u.outId?' for '+nm(u.outId):'');
  if(u.type==='mass')return 'swap: '+u.ins.length+' in, '+u.outs.length+' out';
  if(u.type==='foul')return (u.delta>0?'foul on ':'foul removal, ')+nm(u.id);
  if(u.type==='score')return (u.side==='us'?tn():oppName())+' +'+u.pts;
  if(u.type==='timeout')return (u.side==='us'?'our':oppName()+'’s')+' timeout';
  if(u.type==='mins')return 'minutes fix on '+nm(u.id);
  if(u.type==='scorefix')return (u.side==='us'?tn():oppName())+' −1';
  return 'last action';
}
function undo(){
  const u=S.undo.pop();if(!u){toast('Nothing to undo');return}
  const what=undoLabel(u);
  if(S.clockRunning)tick();
  restoreSnap(u);
  if(u.type==='single'){S.onCourtIds=u.prevOn;st(u.inId).consecutiveSeconds=u.prevConsec;log(clockLabel()+' — UNDO: '+tag(u.inId)+' IN'+(u.outId?' for '+tag(u.outId):'')+' retracted')}
  else if(u.type==='mass'){S.onCourtIds=u.prevOn;Object.entries(u.prevConsec).forEach(([id,c])=>st(id).consecutiveSeconds=c);log(clockLabel()+' — UNDO: quick swap retracted (IN '+u.ins.map(id=>'#'+P(id).num).join(' ')+' • OUT '+u.outs.map(id=>'#'+P(id).num).join(' ')+' reversed)')}
  else if(u.type==='score'){S.score[u.side]-=u.pts;S.score.ev.pop();log(clockLabel()+' — UNDO: '+(u.side==='us'?tn():oppName())+' +'+u.pts+' removed ('+S.score.us+'–'+S.score.them+')')}
  else if(u.type==='timeout'){S.tos.pop();log(clockLabel()+' — UNDO: timeout removed')}
  else if(u.type==='scorefix'){const ev=S.score.ev;if(u.prev.pts>1&&ev[u.i]&&ev[u.i].n===u.prev.n)ev[u.i].pts=u.prev.pts;else ev.splice(u.i,0,u.prev);S.score[u.side]++;log(clockLabel()+' — UNDO: score fix ('+S.score.us+'–'+S.score.them+')')}
  else if(u.type==='mins'){const s=st(u.id);s.playedSeconds=u.before;s.periodSplit=u.split;log(clockLabel()+' — UNDO: minutes fix on '+tag(u.id)+' (back to '+mmss(u.before)+')')}
  else if(u.type==='foul'){const s=st(u.id);s.fouls-=u.delta;s.fouledOut=u.wasOut;if(u.tk)S.tf[u.tk]=Math.max(0,(S.tf[u.tk]||0)-(u.tfD||0));S.onCourtIds=u.prevOn;log(clockLabel()+' — UNDO: foul change on '+tag(u.id)+' (F:'+s.fouls+')')}
  ui.pendingOut=null;replan();save();render();
  toast('Undone: '+what+(u.type==='mass'?' — all '+u.ins.length+' players back':''));
}
function setActive(id,on){
  const p=P(id);if(p.active===on)return;p.active=on;
  if(!on){S.onCourtIds=S.onCourtIds.filter(x=>x!==id);p.hot=false;p.hotUntil=null;p.cold=false;delete S.adj['hot:'+id];delete S.adj['cold:'+id]}
  if(S.started)log(clockLabel()+' — RE-PLAN: '+tag(id)+(on?' added (late arrival)':' unavailable / injured')+', minutes redistributed','rp');

/* ---------- §2.5 hot / cold ---------- */
function hotDebits(id){
  const pt=protectedTier(),T=targets(),cands=availList().filter(p=>p.id!==id&&!p.hot&&p.tier>1&&p.tier!==pt).sort((a,b)=>b.tier-a.tier||T[a.id]-T[b.id]);
  const deb={};let need=S.config.hotBonusMins;
  for(const t of [...new Set(cands.map(p=>p.tier))]){
    const grp=cands.filter(p=>p.tier===t);let prog=true;
    while(need>=.5&&prog){prog=false;for(const p of grp){if(need<.5)break;const fl=Math.max(S.config.devFloorMins,played(p.id)/60);if(T[p.id]+(deb[p.id]||0)-.5>=fl){deb[p.id]=(deb[p.id]||0)-.5;need-=.5;prog=true}}}
    if(need<.5)break;
  }
  return {deb,got:S.config.hotBonusMins-need};
}
function hotLbl(p){const B=blocksAll(),b=B.find(b=>b.abs1===p.hotUntil);return b?blockLabel(b).split('–')[1]+' '+qLabel(b.p):'the end'}
function hotEnd(id){const n=nextPlanned();if(n&&n.outs.includes(id))return n.b.abs1;const now=elapsedAbs(),b=blocksAll().find(b=>b.abs0>=now&&!(S.plan[b.key]||[]).every(x=>S.onCourtIds.includes(x)));return b?b.abs1:sum(S.periods)}
function setHot(id){
  const p=P(id);
  if(p.hot){p.hot=false;p.hotUntil=null;delete S.adj['hot:'+id];log(clockLabel()+' — RE-PLAN: '+tag(id)+' no longer HOT','rp');replan();save();return}
  p.cold=false;delete S.adj['cold:'+id];
  if(S.config.hotBonusMode){const h=hotDebits(id);if(h.got>0){ui.hotConfirm={id,...h};ui.sheet='hot';return}}
  p.hotUntil=hotEnd(id);p.hot=true;log(clockLabel()+' — RE-PLAN: '+tag(id)+' HOT, kept on until '+hotLbl(p),'rp');replan();save();
}
function confirmHot(withBonus){
  const h=ui.hotConfirm;if(!h)return;const p=P(h.id);p.hotUntil=hotEnd(h.id);p.hot=true;
  if(withBonus){S.adj['hot:'+h.id]={...h.deb,[h.id]:h.got};
    log(clockLabel()+' — RE-PLAN: '+tag(h.id)+' HOT +'+mt(h.got)+'m, borrowed from '+Object.keys(h.deb).map(x=>'#'+P(x).num).join(' '),'rp')}
  else log(clockLabel()+' — RE-PLAN: '+tag(h.id)+' HOT, kept on until '+hotLbl(p),'rp');
  ui.hotConfirm=null;ui.sheet=null;replan();save();render();
}
function setCold(id){
  const p=P(id);
  if(p.cold){p.cold=false;delete S.adj['cold:'+id];log(clockLabel()+' — RE-PLAN: '+tag(id)+' no longer COLD','rp');replan();save();return}
  p.hot=false;p.hotUntil=null;delete S.adj['hot:'+id];p.cold=true;
  const T=targets();let trim=Math.floor(Math.min(S.config.coldTrimMins,T[id]-played(id)/60)*2)/2;
  const ev={};
  if(trim>0){ev[id]=-trim;const rec=availList().filter(q=>q.id!==id&&!q.cold&&q.tier<=2).sort((a,b)=>a.tier-b.tier);let i=0,left=trim;while(left>=.5&&rec.length){const q=rec[i%rec.length];ev[q.id]=(ev[q.id]||0)+.5;left-=.5;i++}S.adj['cold:'+id]=ev}
  log(clockLabel()+' — RE-PLAN: '+tag(id)+' COLD, trimmed '+mt(Math.max(0,trim))+'m and rested next block','rp');
  replan();save();
}

// Copy: try the old-style copy first (works inside the claude.ai frame and most phones), then the clipboard API,

function execCopy(text){

    document.body.appendChild(t);t.focus();t.select();t.setSelectionRange(0,text.length);

// where the plan says he finishes: minutes played + the rest of the plan (the current block counts only if he's on court now)
function projMins(id){
  const now=elapsedAbs();let x=played(id);
  if(!S.finished)blocksAll().forEach(b=>{if(b.abs1<=now)return;if(b.abs0<now){if(S.started&&S.onCourtIds.includes(id))x+=b.abs1-now}else if((S.plan[b.key]||[]).includes(id))x+=b.dur});
  return x/60;
}
// on track = within 1 min of target; short by more than 1 (amber) or 2.5 (red); over by more than 1 (blue)
function trackOf(id,tg){const d=projMins(id)-tg;return {d,cls:d< -2.5?'way':d< -1?'short':d>1?'over':'ok'}}
const trackTxt=t=>t.cls==='ok'?'on track':t.d<0?m1(-t.d)+'m short':'+'+m1(t.d)+'m over';
function card(p,T,on,ctx){
  const s=st(p.id),a=played(p.id)/60,tg=T[p.id]||0,tot=sum(S.periods);
  const exp=tg*elapsedAbs()/tot,pace=a-exp;
  const pct=tg?Math.min(100,a/tg*100):0,ep=tg?Math.min(100,exp/tg*100):0;
  const pending=ui.pendingOut===p.id;
  const b=[];
  if(p.hot)b.push('<span class="chip hot">🔥 Hot</span>');
  if(p.cold)b.push('<span class="chip cold">❄️ Cold</span>');

  const rl=(+S.config.restMaxMins||0)*60;if(on&&S.started&&rl&&s.consecutiveSeconds>=rl)b.push(`<span class="chip warn">Needs a rest · ${mmssShort(s.consecutiveSeconds)} on</span>`);
  if(S.closersIds.includes(p.id))b.push('<span class="chip acc">Closer</span>');
  let btn;
  if(on)btn=`<button class="act out" data-act="out:${p.id}">${pending?'Cancel':'OUT'}</button>`;
  else btn=`<button class="act in" data-act="in:${p.id}">IN</button>`;   // any bench player can come on; the app only suggests
  const tk=trackOf(p.id,tg);
  return `<div class="card ${on?'on':''} ${pending?'pending':''}" data-lp="menu:${p.id}">
    <div class="r1"><span class="num">#${p.num}</span><span class="nm">${esc(p.name)}</span><span class="tier t${p.tier}">T${p.tier}</span>
      <button class="fbtn ${foulRisk(p.id)?'risk':''}" data-act="foul:${p.id}" data-lp="foulm:${p.id}" aria-label="Add foul, hold to remove">F:${s.fouls}</button>${btn}
      <button class="more" data-act="menu:${p.id}" aria-label="More">⋯</button></div>
    <div class="r2">${b.join('')}<span>${m1(a)} / ${m1(tg)}m${tg-a>0?' · '+m1(tg-a)+' left':''}</span><span class="trk ${tk.cls}">· ${S.finished?(tk.cls==='ok'?'on target':tk.d<0?m1(-tk.d)+'m short':'+'+m1(tk.d)+'m over'):trackTxt(tk)}</span>${on&&S.started?'<span>· on '+mmssShort(s.consecutiveSeconds)+'</span>':''}</div>
    <div class="bar ${tk.cls}" title="${S.finished?'Final minutes vs target':'Plan finishes on '+m1(projMins(p.id))+' of '+m1(tg)}"><i style="width:${pct}%"></i>${S.started?`<b style="left:${ep}%"></b>`:''}</div></div>`;
}
function viewGlance(){

  if(S.started&&!S.finished){
    if(!n||!n.ins.length)next='<div class="gnext"><div class="gh muted">No more planned changes</div></div>';

function liveCalls(){
  const lock=inLockLive(),n=nextPlanned();
  const closersIn=!!(lock&&n&&n.ins.length&&n.ins.every(id=>S.closersIds.includes(id)));
  const later=!!(n&&!n.overdue&&n.b.p>S.period&&S.clockSeconds>0);   // due next quarter: keep it for the break
  const show=!!(S.started&&!S.finished&&n&&!later&&(!lock||closersIn||n.fill));
  return {lock,n,closersIn,later,show,due:show?n.outs.slice():[],next:show?n.ins.slice():[]};
}

function foulDanger(){

function resync(delta,abs){
  if(S.clockRunning)tick();
  const before=S.clockSeconds;
  S.clockSeconds=Math.max(0,Math.min(len(),abs!=null?abs:S.clockSeconds+delta));
  const moved=before-S.clockSeconds;   // + = the table clock had run further than ours: the five on court played that time too
  if(S.started&&moved)S.onCourtIds.forEach(id=>{const s=st(id);while(s.periodSplit.length<S.period)s.periodSplit.push(0);
    const d=moved>0?moved:-Math.min(-moved,s.periodSplit[S.period-1]);   // winding back never takes more than he's played this quarter
    s.playedSeconds+=d;s.periodSplit[S.period-1]+=d;s.consecutiveSeconds=Math.max(0,s.consecutiveSeconds+d)});
  log(qLabel(S.period)+' — RESYNC '+mmss(before)+' → '+mmss(S.clockSeconds)+(S.started&&moved?' · on-court minutes '+(moved>0?'+':'−')+mmssShort(Math.abs(moved)):''));
  if(S.started)replan();save();renderSheet();
}

  return {court:ids2n(S.onCourtIds),next:n?{blk:n.b.key,in:ids2n(n.ins),out:ids2n(n.outs),overdue:!!n.overdue}:null,
    lock:lc.lock,prompt:lc.show,hot:S.roster.filter(p=>p.hot).map(p=>p.num),cold:S.roster.filter(p=>p.cold).map(p=>p.num),
    tg,secs,fouls,plan,adj:JSON.parse(JSON.stringify(S.adj)),applied:Object.keys(S.applied),fixed:Object.keys(S.fixed),halves:Object.keys(S.halves||{}),pinned:Object.keys(S.pinned||{}),moves:{...(S.moves||{})},score:[S.score.us,S.score.them],tos:S.tos.length,tf:[tfUs(),tfThem()],status:n?n.status:null};
}
function dbg(a,x,pre){
  try{
    if(!S.debug)dbgInit();
    const ev=S.debug.ev;if(ev.length>=3000)ev.splice(0,500);
    let r;try{r=dbgSnap()}catch(e){r={err:String(e&&e.stack||e)}}
    pre=pre||{p:S.period,c:S.clockSeconds,run:S.clockRunning};
    ev.push({i:ev.length?ev[ev.length-1].i+1:0,w:Date.now(),p:pre.p,c:Math.round(pre.c*10)/10,run:pre.run,a,x:x||[],r});
  }catch(e){}
}
function traced(name,fn){return function(...args){
  const pre={p:S.period,c:S.clockSeconds,run:S.clockRunning};
  if(dbgDepth===0&&name==='quickSwap'){const n=nextPlanned();pre.saw=n?{blk:n.b.key,in:n.ins.slice(),out:n.outs.slice(),overdue:!!n.overdue}:null}
  dbgDepth++;let out;try{out=fn.apply(this,args)}finally{dbgDepth--}
  if(dbgDepth===0)dbg(name,pre.saw?[pre.saw]:args,pre);
  return out}}
doSub=traced('doSub',doSub);quickSwap=traced('quickSwap',quickSwap);skipPlanned=traced('skipPlanned',skipPlanned);
addFoul=traced('addFoul',addFoul);undoFoul=traced('undoFoul',undoFoul);undo=traced('undo',undo);
startClock=traced('startClock',startClock);pauseClock=traced('pauseClock',pauseClock);resync=traced('resync',resync);
setActive=traced('setActive',setActive);setHot=traced('setHot',setHot);confirmHot=traced('confirmHot',confirmHot);setCold=traced('setCold',setCold);
startNextPeriod=traced('startNextPeriod',startNextPeriod);pinBlock=traced('pinBlock',pinBlock);addScore=traced('addScore',addScore);callTimeout=traced('callTimeout',callTimeout);importGame=traced('importGame',importGame);unpinBlock=traced('unpinBlock',unpinBlock);moveBoundary=traced('moveBoundary',moveBoundary);adjMins=traced('adjMins',adjMins);addTeamFoulThem=traced('addTeamFoulThem',addTeamFoulThem);scoreMinus=traced('scoreMinus',scoreMinus);setScorer=traced('setScorer',setScorer);addOT=traced('addOT',addOT);endPeriodEarly=traced('endPeriodEarly',endPeriodEarly);fullTime=traced('fullTime',fullTime);
// Compact trace (pumas-debug-2): each event keeps only what changed since the one before, then the whole thing is
// gzipped and base64'd so a full game fits a phone clipboard / chat paste. Long traces are split into parts.
const TRACE_PART_CHARS=12000;
function debugPayload(){
  const {debug,undo,...rest}=S,ev=[];let prev={};
  (debug?debug.ev:[]).forEach(e=>{
    const r=e.r||{},d={};
    for(const k in r){
      if(k==='plan'&&r.plan&&typeof r.plan==='object'){const pd={},pp=prev.plan||{};
        for(const bk in r.plan)if(JSON.stringify(r.plan[bk])!==JSON.stringify(pp[bk]))pd[bk]=r.plan[bk];
        for(const bk in pp)if(!(bk in r.plan))pd[bk]=null;
        if(Object.keys(pd).length)d.plan=pd;}
      else if(JSON.stringify(r[k])!==JSON.stringify(prev[k]))d[k]=r[k];
    }
    ev.push({...e,r:d});prev=r;
  });
  return {format:'pumas-debug-2',app:APP_VERSION,exported:new Date().toISOString(),ua:(navigator&&navigator.userAgent)||'',start:debug&&debug.start,ev,final:rest};
}
async function debugExportCompact(){
  const json=JSON.stringify(debugPayload());
  try{
    if(typeof CompressionStream==='undefined')throw 0;
    const cs=new CompressionStream('gzip'),w=cs.writable.getWriter();w.write(new TextEncoder().encode(json));w.close();
    const bytes=new Uint8Array(await new Response(cs.readable).arrayBuffer());let bin='';
    for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
    return 'PUMAS-TRACE-2:'+btoa(bin);
  }catch(e){return json}
}
function traceParts(str){if(str.length<=TRACE_PART_CHARS)return [str];const n=Math.ceil(str.length/TRACE_PART_CHARS),out=[];
  for(let i=0;i<n;i++)out.push('PUMAS-PART '+(i+1)+'/'+n+':'+str.slice(i*TRACE_PART_CHARS,(i+1)*TRACE_PART_CHARS));return out}
function prepareTrace(){
  const n=S.debug?S.debug.ev.length:0;
  if(ui.trace&&ui.trace.n===n&&ui.trace.id===S.match.id)return;
  const id=S.match.id;ui.trace={n,id,parts:null};
  debugExportCompact().then(str=>{if(!ui.trace||ui.trace.n!==n||ui.trace.id!==id)return;ui.trace.parts=traceParts(str);ui.trace.size=str.length;if(ui.tab==='logs')renderTraceBox()});
}
function renderTraceBox(){
  const box=document.getElementById('dbgbox');if(!box)return;const t=ui.trace;
  if(!t||!t.parts){box.innerHTML='<p class="note">Preparing the trace…</p>';return}
  const k=Math.max(1,Math.round(t.size/1024));
  box.innerHTML=`<p class="note">${t.n} engine events, packed into ${k} KB${t.parts.length>1?` — in ${t.parts.length} parts so nothing gets cut off. Copy and paste each part (in any order)`:''}. Paste it into a chat with Claude to replay the game step by step.</p>
    <div class="pbtns">${t.parts.map((_,i)=>`<button class="btn" data-act="copy:dbgpart${i+1}">${t.parts.length>1?'Copy part '+(i+1)+' of '+t.parts.length:'Copy debug trace'}</button>`).join('')}</div>
    ${t.parts.map((p,i)=>`<textarea id="dbgpart${i+1}" readonly style="position:absolute;left:-9999px;width:1px;height:1px">${esc(p)}</textarea>`).join('')}`;
}
function debugExport(){const {debug,...rest}=S;return JSON.stringify({format:'pumas-debug-1',app:APP_VERSION,exported:new Date().toISOString(),ua:(navigator&&navigator.userAgent)||'',start:debug&&debug.start,ev:debug?debug.ev:[],final:rest})}
window.addEventListener&&window.addEventListener('error',e=>dbg('error',[String(e.message),e.lineno||0]));

/* ---------- events ---------- */
function act(a,e){
  const [k,id,v]=a.split(':');
  switch(k){
    case 'tab':ui.tab=id;ui.pendingOut=null;render();window.scrollTo(0,0);break;
    case 'clock':if(S.finished)break;if(!S.started||S.clockSeconds>0)toggleClock();else openBreak(),render();break;
    case 'resync':ui.sheet='resync';renderSheet();break;
    case 'out':ui.pendingOut=ui.pendingOut===id?null:id;render();break;
    case 'in':
      if(S.finished)break;
      if(ui.pendingOut)doSub(ui.pendingOut,id);
      else if(S.onCourtIds.length<5)doSub(null,id);
      else toast('Tap OUT on a court player first');break;
    case 'foul':addFoul(id,1);if(ui.sheet==='menu'){ui.sheet=null;render()}break;
    case 'foulm':addFoul(id,-1);ui.sheet=null;render();break;
    case 'menu':ui.sheet='menu';ui.sheetId=id;renderSheet();break;
    case 'hot':ui.sheet=null;setHot(id);render();break;
    case 'cold':ui.sheet=null;setCold(id);render();break;
    case 'hotyes':confirmHot(true);break;
    case 'hotno':confirmHot(false);break;
    case 'qswap':quickSwap();if(ui.sheet==='break')renderSheet();break;
    case 'qswapgo':quickSwap(true);renderSheet();break;
    case 'undo':undo();if(ui.sheet==='score')renderSheet();break;
    case 'foulundo':undoFoul(id);break;
    case 'skipplan':skipPlanned();break;
    case 'sheet':ui.sheet=id==='to'?'to':id;renderSheet();break;
    case 'fdsub':doSub(id,v);break;
    case 'fdkeep':S.foulAck[id]=4;log(clockLabel()+' — '+tag(id)+' kept on with 4 fouls');save();render();break;
    case 'sc':addScore(id,+v);if(ui.sheet==='score')renderSheet();break;
    case 'to':callTimeout(id);break;
    case 'archive':archiveGame();render();toast('Saved to the season');break;
    case 'practice':S.match.practice=id==='1';save();render();break;
    case 'glance':ui.glance=id==='1';render();break;
    case 'awaketry':ui.sheet=null;requestWake().then(()=>{renderSheet();render();toast(ui.awake!=='none'?'Screen will stay on':'Your phone said no — use the settings tip')});break;
    case 'gsc':addScore(id,+v);break;
    case 'scm':scoreMinus(id);if(ui.sheet==='score')renderSheet();break;
    case 'scorer':if(id==='-'){ui.askScorer=null;render()}else setScorer(id);if(ui.sheet==='score')renderSheet();break;
    case 'askdel':ui.sheet='delp';ui.sheetId=id;renderSheet();break;
    case 'rsgo':{const r=restoreBackup(($('#rsText')||{}).value,id==='1');if(!r){toast('That isn’t a backup from this app — copy it again from Logs → Season');break}ui.sheet=null;render();toast('Backup restored · '+r.added+' game'+(r.added===1?'':'s')+' added'+(r.squad?' · squad & settings restored':''));break}
    case 'gdhere':{const p=P(id);if(p){setActive(id,!p.active);if(!p.active)p.starter=false;ui.sheet='gameday';render()}break}
    case 'gdstart':{const p=P(id);if(p){p.starter=!p.starter;if(!S.started)replan();save();render()}break}
    case 'print':openPrint();break;
    case 'printclose':closePrint();break;
    case 'printgo':try{window.print()}catch(e){toast('Printing is blocked here — use the installed app, or take a screenshot')}break;
    case 'bh':{const p=P(id);if(p){p.bh=!p.bh;dbg('setup:bh',[id,p.bh]);replan();save();render()}break}
    case 'delp':dbg('setup:del',[id]);removePlayer(id);ui.sheet=null;renderSheet();break;
    case 'mins':adjMins(id,+v);renderSheet();break;
    case 'tft':addTeamFoulThem(+id);renderSheet();break;
    case 'impgo':{const n=importGame(($('#impText')||{}).value,($('#impDate')||{}).value,($('#impOpp')||{}).value,($('#impUs')||{}).value,($('#impThem')||{}).value);if(!n){toast('Couldn’t read that — paste the CSV or WhatsApp summary from this app');break}ui.sheet=null;render();toast('Added '+n+' players to the season');break}
    case 'sgdel':removeSeasonGame(id);renderSheet();break;
    case 'sgclear':ui.sheet='sgclear';renderSheet();break;
    case 'sgclearyes':clearSeason();ui.sheet=null;render();toast('Season cleared');break;
    case 'blk':ui.sheet='block';ui.sheetId=a.slice(4);ui.draft=null;renderSheet();break;
    case 'draft':{const d=ui.draft||[],i=d.indexOf(id);if(i>=0)d.splice(i,1);else if(d.length<Math.min(5,availList().length))d.push(id);else{toast('Five picked — tap one to drop him first');break}ui.draft=d;renderSheet();break}
    case 'pin':{const key=a.slice(4);pinBlock(key,ui.draft||[]);ui.sheet=null;ui.draft=null;render();toast('Lineup locked');break}
    case 'unpin':{const key=a.slice(6);unpinBlock(key);ui.draft=null;renderSheet();break}
    case 'mv':{const parts=a.split(':');moveBoundary(parts[1],+parts[2]);renderSheet();break}
    case 'tm':{const c=S.config.tierMins;c[id]=Math.max(0,Math.min(32,(+c[id]||0)+(+v)));replan();save();render();break}
    case 'break':openBreak();render();break;
    case 'endnow':endPeriodEarly();break;
    case 'nextp':startNextPeriod();break;
    case 'ot':addOT(+id);break;
    case 'fulltime':fullTime();break;
    case 'rs':resync(+id);break;
    case 'rsset':{const m=($('#rsv').value||'').match(/^(\d{1,2}):?(\d{2})$/);if(!m){toast('Type the time like 4:35');break}resync(0,(+m[1])*60+(+m[2]));break}
    case 'close':ui.sheet=null;ui.hotConfirm=null;ui.draft=null;render();break;
    case 'scrim':if(e.target.classList.contains('scrim')){ui.sheet=null;ui.hotConfirm=null;render()}break;
    case 'active':ui.sheet=null;setActive(id,!P(id).active);break;
    case 'starter':{const p=P(id);p.starter=!p.starter;if(!S.started)replan();save();render();break}
    case 'closer':{const i=S.closersIds.indexOf(id);if(i>=0)S.closersIds.splice(i,1);else{if(S.closersIds.length>=5){toast('Five closers already — remove one first');break}S.closersIds.push(id)}replan();save();render();break}
    case 'cfg':{let val=v==='true'?true:v==='false'?false:isNaN(+v)?v:+v;
      if(id==='quarterMins'){
        if(S.started){toast('Quarter length can’t change once the game has started');break}
        S.config.quarterMins=val;S.periods=Array(4).fill(val*60);S.period=1;S.clockSeconds=val*60;S.plan={};S.fixed={};S.applied={};S.halves={};S.pinned={};S.moves={};
        replan();save();render();toast(val+'-minute quarters · '+(val*4)+' minutes a game');break}
      S.config[id]=val;replan();save();render();break}
    case 'addplayer':{let n=1;while(S.roster.some(p=>p.num===n))n++;const pid='x'+Date.now();S.roster.push({id:pid,num:n,name:'New player',tier:4,active:true,hot:false,cold:false,starter:false});st(pid);replan();save();render();break}
    case 'askreset':ui.sheet='reset';renderSheet();break;
    case 'askfactory':ui.sheet='factory';renderSheet();break;
    case 'factory':S=freshMatch();dbgInit();ui.sheet=null;ui.tab='setup';ui.pendingOut=null;replan();save();render();toast('Everything reset to defaults');break;
    case 'sec':secToggle(id);render();break;
    case 'tmreset':S.config.tierMins={...DEF_CFG.tierMins};replan();save();render();toast('Tier minutes back to 20 / 15 / 10 / 6');break;
    case 'reset':S=freshMatch(S);dbgInit();S.config.tierMins={...S.config.tierMins};ui.sheet=null;ui.tab='live';ui.pendingOut=null;releaseWake();replan();save();render();toast('New match ready — tap the clock to tip off');break;
    case 'copy':copyText(id);break;
    case 'copysel':{const t=document.getElementById('copyArea');if(t){t.focus();t.setSelectionRange(0,t.value.length);if(execCopy(t.value)){toast((ui.copyLabel||'Text')+' copied')}}break}
  }
  if(['cfg','tm','tmreset','starter','closer','addplayer','practice'].includes(k))dbg('setup:'+k,[id,v]);
}
document.addEventListener('click',e=>{
  if(!e.target.closest('#toast [data-act]'))hideToast();
  if(Date.now()-ui.lpUp<450){e.preventDefault();return}
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.disabled)return;act(t.dataset.act,e);
  if(wantAwake()&&(ui.awake==='none'||(ui.awake==='lock'&&!wakeLock)))requestWake();
});
document.addEventListener('change',e=>{
  const c=e.target.dataset.chg;if(!c)return;const [k,id]=c.split(':'),v=e.target.value;
  if(k==='opp')S.match.opp=v;else if(k==='date')S.match.date=v;
  else if(k==='cfgtxt'&&(id==='teamName'||id==='teamFull'))S.config[id]=v.slice(0,40);
  else if(k==='name')P(id).name=v.trim()||P(id).name;
  else if(k==='num'){const n=parseInt(v,10);if(n>=0)P(id).num=n}
  else if(k==='tier'){P(id).tier=+v;if(S.started)log(clockLabel()+' — RE-PLAN: '+tag(id)+' moved to T'+v,'rp');replan()}
  dbg('setup:'+k,[id,v]);save();if(k==='tier')render();
});
let lpTimer=null,lpStart=null;
document.addEventListener('pointerdown',e=>{
  const t=e.target.closest('[data-lp]');if(!t)return;const bt=e.target.closest('button');if(bt&&bt!==t)return;
  lpStart=[e.clientX,e.clientY];
  lpTimer=setTimeout(()=>{ui.lpFired=true;const a=t.dataset.lp;const [k2,i2]=a.split(':');if(k2==='foulm'){if(st(i2).fouls>0)undoFoul(i2)}else{if(k2==='resync'){ui.sheet='resync'}else{ui.sheet='menu';ui.sheetId=i2}renderSheet()}if(navigator.vibrate)try{navigator.vibrate(20)}catch(_){}},550);
});
const lpCancel=e=>{clearTimeout(lpTimer);lpTimer=null;if(ui.lpFired){ui.lpFired=false;ui.lpUp=Date.now()}};
document.addEventListener('pointerup',lpCancel);document.addEventListener('pointercancel',lpCancel);
document.addEventListener('pointermove',e=>{if(lpTimer&&lpStart&&Math.hypot(e.clientX-lpStart[0],e.clientY-lpStart[1])>10)lpCancel()});

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){tick();if(ui.awake==='video')ui.awake='none';requestWake();render()}
  else save();
});

let lastSec=-1,lastNudge=false;
setInterval(()=>{
  const moved=tick();
  alertTick();
  if(ui.tab!=='live'||ui.sheet)return;
  const sec=Math.ceil(S.clockSeconds),nudge=!S.clockRunning&&S.pausedAt&&Date.now()-S.pausedAt>10000;
  if(ui.askScorer&&!askLive()){ui.askScorer=null;render();return}
  if((moved&&sec!==lastSec)||nudge!==lastNudge){lastSec=sec;lastNudge=nudge;render()}
},250);

if(!S.debug)dbgInit();dbg('load',[APP_VERSION]);
replan();save();render();
</script>
